<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Frame body -->
  <rect x="0"   y="0"   width="200" height="50"  fill="#F5F0E8"/>
  <rect x="0"   y="150" width="200" height="50"  fill="#F5F0E8"/>
  <rect x="0"   y="50"  width="50"  height="100" fill="#F5F0E8"/>
  <rect x="150" y="50"  width="50"  height="100" fill="#F5F0E8"/>
  <!-- Top bevel (barely lighter) -->
  <polygon points="0,0 200,0 150,50 50,50" fill="#FFFFFF"/>
  <!-- Bottom bevel (slightly darker) -->
  <polygon points="0,200 200,200 150,150 50,150" fill="#DDD8CC"/>
  <!-- Left bevel -->
  <polygon points="0,0 0,200 50,150 50,50" fill="#FAF8F2"/>
  <!-- Right bevel -->
  <polygon points="200,0 200,200 150,150 150,50" fill="#E8E3D8"/>
  <!-- Outer edge -->
  <rect x="1" y="1" width="198" height="198" fill="none" stroke="#B0A890" stroke-width="1.5"/>
  <!-- Inner edge -->
  <rect x="47" y="47" width="106" height="106" fill="none" stroke="#B0A890" stroke-width="1.5"/>
  <!-- Inner shadow -->
  <rect x="49" y="49" width="102" height="102" fill="none" stroke="#C8C0A8" stroke-width="1"/>
</svg>